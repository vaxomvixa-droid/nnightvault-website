name: Publish NIGHTVAULT Blog Posts

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - name: Publish next queued blog post
        run: |
          mkdir -p blog
          mkdir -p blog-queue

          POST=$(find blog-queue -maxdepth 1 -type f -name "*.html" | sort | head -n 1)

          if [ -z "$POST" ]; then
            echo "No blog posts waiting to publish."
            exit 0
          fi

          FILENAME=$(basename "$POST")

          echo "Publishing: $FILENAME"

          git mv "$POST" "blog/$FILENAME"

          git config user.name "NIGHTVAULT Blog Bot"
          git config user.email "actions@github.com"

          git add blog blog-queue

          git commit -m "Publish NIGHTVAULT blog: $FILENAME"
          git push

      - name: Finished
        run: echo "Blog publishing check complete"
