name: Publish NIGHTVAULT Blog Posts

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - name: Publish next queued blog post
        run: |
          mkdir -p blog-queue
          POST=$(find blog-queue -maxdepth 1 -type f -name "*.html" | head -n 1)

          if [ -z "$POST" ]; then
            echo "No blog posts waiting to publish."
            exit 0
          fi

          FILENAME=$(basename "$POST")
          cp "$POST" "$FILENAME"
          rm "$POST"

          git config user.name "NIGHTVAULT Blog Bot"
          git config user.email "actions@github.com"

          git add .
          git commit -m "Publish blog post: $FILENAME"
          git push

      - name: Finished
        run: echo "Blog publishing check complete"
